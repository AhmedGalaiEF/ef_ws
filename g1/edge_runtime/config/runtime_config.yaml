# Edge Runtime Configuration

# Logging settings
logging:
  level: INFO
  file: /var/log/g1_edge_runtime.log
  max_size: 10MB
  backup_count: 5

# Skill management settings
skills:
  repository_path: /opt/g1/skills
  max_concurrent_skills: 3
  default_timeout: 300

# Telemetry settings
telemetry:
  interval: 60
  endpoint: https://telemetry.example.com/api/v1/telemetry
  batch_size: 100

# Update settings
updates:
  check_interval: 3600
  auto_install: false
  fallback_version: 3.2.0

# Safety settings
safety:
  emergency_stop_timeout: 5
  heartbeat_interval: 10
  max_cpu_usage: 80
  max_memory_usage: 85

# Network settings
network:
  retry_interval: 10
  timeout: 30
  use_proxy: false
