[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control"
version = "0.1.0"
description = "Ollama-backed Unitree G1 AI control CLI"
requires-python = ">=3.8"

[project.scripts]
ai-control = "ai_control.cli:run"

[tool.setuptools]
packages = ["ai_control"]
package-dir = {"ai_control" = "."}
